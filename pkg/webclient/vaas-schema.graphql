  """
  The initial creation of the cryptographic objects has completed
  successfully.
  """
  IssuedSuccessfully @join__enumValue(graph: CODESIGN)

  """Renewal of the cryptographic objects has completed successfully"""
  RenewedSuccessfully @join__enumValue(graph: CODESIGN)

  """
  Request to create or renew cryptographic objects has failed due to missing
  related required cryptographic objects.
  """
