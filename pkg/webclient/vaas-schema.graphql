  The initial creation of the cryptographic objects has been requested, and is
  currently in progress.
  """
  IssuanceRequested @join__enumValue(graph: CODESIGN)

  """
  Renewal of the cryptographic objects has been requested or triggered
  automatically due to expired objects, and is currently in progress.
  """
