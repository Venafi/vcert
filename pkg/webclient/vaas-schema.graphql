"""
Lifecycle of a transition plan, from generation through to a successful apply.

    PENDING -> READY | FAILED
    READY -> EVALUATING, or READY again when updatePlan saves edits
    EVALUATING -> EVALUATED | EVALUATION_FAILED, or back to READY when the evaluation does not complete
    EVALUATED -> READY (updatePlan) | EVALUATING (re-evaluated) | APPLYING (applyPlan)
    EVALUATION_FAILED -> READY (updatePlan) | PENDING (createPlan)
    APPLYING -> APPLIED | APPLY_FAILED
"""
enum TransitionPlanState
  @join__type(graph: IAM_TENANT_MANAGEMENT)
{
  """The plan is being generated."""
  PENDING @join__enumValue(graph: IAM_TENANT_MANAGEMENT)

  """Generated. The document is available to review and edit."""
  READY @join__enumValue(graph: IAM_TENANT_MANAGEMENT)

  """Generation did not complete. See error."""
  FAILED @join__enumValue(graph: IAM_TENANT_MANAGEMENT)

  """An evaluation of this plan is running."""
  EVALUATING @join__enumValue(graph: IAM_TENANT_MANAGEMENT)

  """
  Evaluated. Current data has the resources the plan places, and the plan can be applied.
  """
  EVALUATED @join__enumValue(graph: IAM_TENANT_MANAGEMENT)

  """
  Resources were added or removed since the plan. See error; save the plan again with updatePlan or regenerate it with createPlan.
  """
  EVALUATION_FAILED @join__enumValue(graph: IAM_TENANT_MANAGEMENT)

  """
  The plan is being applied. createPlan, updatePlan, evaluatePlan and applyPlan are refused.
  """
  APPLYING @join__enumValue(graph: IAM_TENANT_MANAGEMENT)

  """The plan has been successfully applied."""
  APPLIED @join__enumValue(graph: IAM_TENANT_MANAGEMENT)

  """The apply did not complete. See error."""
  APPLY_FAILED @join__enumValue(graph: IAM_TENANT_MANAGEMENT)
}

