query ListMachineIdentities($cloudKeystoreId: UUID, $after: String) {
    cloudMachineIdentities(filter: {cloudKeystoreId: $cloudKeystoreId}, after: $after) {
        nodes {
            id
            cloudKeystoreId
            cloudKeystoreName
            cloudProviderId
            cloudProviderName
            metadata {
                ... on AWSCertificateMetadata {
                    arn
                }
                ... on AzureCertificateMetadata {
                    azureId
                    name
                    version
                }
                ... on GCPCertificateMetadata {
                    gcpId
                    name
                }
            }
            status
            statusDetails
            certificateId
        }
        pageInfo {
            hasNextPage
            endCursor
        }
    }
}
